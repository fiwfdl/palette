name: Milestone notify

on:
  pull_request:
    types: [opened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    if: github.event.action == 'opened' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      # Cloudflare Pages Direct Upload projects get a generated project
      # subdomain (e.g. palette-aeq.pages.dev) that does not match the repo or
      # project name, so read the real host from the Pages API. `PAGES_DOMAIN`
      # is an explicit escape hatch; the literal is the known-correct fallback
      # for this project when no Cloudflare credentials are configured.
      - name: Resolve Cloudflare Pages host
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'palette' }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN || 'palette-aeq.pages.dev' }}
        run: |
          domain="${PAGES_DOMAIN#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            api_domain="$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}" \
              | jq -r '.result.subdomain // empty')"
            if [ -n "$api_domain" ]; then
              domain="$api_domain"
            fi
          fi
          echo "domain=${domain}" >> "$GITHUB_OUTPUT"
          echo "Resolved Pages host: ${domain}"

      - name: Comment PR link and URLs
        uses: actions/github-script@v7
        env:
          NOTIFY_GITHUB_HANDLE: ${{ vars.NOTIFY_GITHUB_HANDLE }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          PREVIEW_URL_TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE }}
          PAGES_DOMAIN: ${{ steps.pages.outputs.domain }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const slug = branch.replace(/[^a-zA-Z0-9-]+/g, "-");

            const handle = (process.env.NOTIFY_GITHUB_HANDLE || "").trim() || owner;
            const domain = ((process.env.PAGES_DOMAIN || "").trim() || `${repo}.pages.dev`)
              .replace(/^https?:\/\//, "")
              .replace(/\/+$/, "");
            const liveUrl = (process.env.LIVE_URL || "").trim() || `https://${domain}`;
            const previewUrl = (process.env.PREVIEW_URL_TEMPLATE || "").trim()
              ? process.env.PREVIEW_URL_TEMPLATE.trim().replace("{branch}", slug)
              : `https://${slug}.${domain}`;

            const state = pr.merged ? "merged" : pr.state;
            const headline = pr.merged ? "Pull request merged" : "Pull request opened";

            const body = [
              `### ${headline}`,
              "",
              `- PR: ${pr.html_url}`,
              `- Preview: ${previewUrl}`,
              `- Live: ${liveUrl}`,
              "",
              `@${handle} ${state} on \`${branch}\`.`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });
