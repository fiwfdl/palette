name: Milestone notify

on:
  pull_request:
    types: [opened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    if: github.event.action == 'opened' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR link and URLs
        uses: actions/github-script@v7
        env:
          NOTIFY_GITHUB_HANDLE: ${{ vars.NOTIFY_GITHUB_HANDLE }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          PREVIEW_URL_TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const slug = branch.replace(/[^a-zA-Z0-9-]+/g, "-");

            const handle = (process.env.NOTIFY_GITHUB_HANDLE || "").trim() || owner;
            const liveUrl = (process.env.LIVE_URL || "").trim() || `https://${repo}.pages.dev`;
            const previewUrl = (process.env.PREVIEW_URL_TEMPLATE || "").trim()
              ? process.env.PREVIEW_URL_TEMPLATE.trim().replace("{branch}", slug)
              : `https://${slug}.${repo}.pages.dev`;

            const state = pr.merged ? "merged" : pr.state;
            const headline = pr.merged ? "Pull request merged" : "Pull request opened";

            const body = [
              `### ${headline}`,
              "",
              `- PR: ${pr.html_url}`,
              `- Preview: ${previewUrl}`,
              `- Live: ${liveUrl}`,
              "",
              `@${handle} ${state} on \`${branch}\`.`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });
